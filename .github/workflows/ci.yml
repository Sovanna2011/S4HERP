name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  MSSQL_SA_PASSWORD: "Ci!Pipeline#2026"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci!Pipeline#2026"
          MSSQL_PID: Developer
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 30s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore S4HERP.sln

      - name: Build
        # Warnings are errors (Directory.Build.props), so this is also the lint step.
        run: dotnet build S4HERP.sln -c Release --no-restore

      - name: Architecture tests
        # Module boundaries, domain purity, schema ownership, concurrency tokens
        # and tenant filters. Cheap, and they fail before anything slower runs.
        run: dotnet test tests/S4HERP.ArchitectureTests -c Release --no-build

      - name: Apply schema
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=S4HERP;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True"
        run: dotnet run --project src/Host/S4HERP.Host -c Release --no-build -- --migrate

      - name: Migrations reverse cleanly
        # A migration without a working Down is not a migration, it is a one-way
        # door. Proven here rather than discovered during a rollback.
        env:
          ConnectionStrings__Default: "Server=localhost,1433;Database=S4HERP_Down;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True"
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --project src/Host/S4HERP.Host
          dotnet ef database update 0 --project src/Host/S4HERP.Host

      - name: Start the host
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_HTTP_PORTS: "8080"
          ConnectionStrings__Default: "Server=localhost,1433;Database=S4HERP;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True"
        run: |
          dotnet run --project src/Host/S4HERP.Host -c Release --no-build &
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/ready)" = "200" ] && exit 0
            sleep 5
          done
          echo "host did not become ready"; exit 1

      - name: Database integrity rules
        run: |
          docker exec "$(docker ps -qf ancestor=mcr.microsoft.com/mssql/server:2025-latest)" \
            mkdir -p /tmp/tests
          docker cp db/tests/integrity-rules.sql \
            "$(docker ps -qf ancestor=mcr.microsoft.com/mssql/server:2025-latest)":/tmp/tests.sql
          # -I sets QUOTED_IDENTIFIER ON, which DML against filtered indexes needs.
          docker exec "$(docker ps -qf ancestor=mcr.microsoft.com/mssql/server:2025-latest)" \
            /opt/mssql-tools18/bin/sqlcmd -C -I -S localhost -U sa -P "$MSSQL_SA_PASSWORD" \
            -d S4HERP -i /tmp/tests.sql | tee integrity.log
          grep -q "14/14 passed" integrity.log

      - name: Posting engine acceptance
        run: ./db/tests/posting-engine.sh http://localhost:8080

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the OpenUI5 bundle
        working-directory: ui5
        run: |
          npm install --no-audit --no-fund
          npm run build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the container image
        # Multi-stage: the UI is built and copied in, so the image is one
        # self-contained deployable with no CDN dependency.
        run: docker build -f src/Host/S4HERP.Host/Dockerfile -t s4herp:${{ github.sha }} .
